<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RepLog — Workout Logbook</title>
<link rel="icon" type="image/png" href="REPLOG-ICON.png">
<link rel="apple-touch-icon" href="REPLOG-ICON.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RepLog">
<meta name="theme-color" content="#08090a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08090a;
    --panel: #131417;
    --panel-2: #1a1c20;
    --panel-3: #202329;
    --line: #2a2d33;
    --chalk: #f1f3f1;
    --chalk-dim: #888d90;
    --chalk-faint: #55595c;

    --upper: #b6ff00;
    --upper-soft: rgba(var(--neon-rgb),0.12);
    --upper-dim: #2b3300;

    --lower: #b6ff00;
    --lower-soft: rgba(var(--neon-rgb),0.12);
    --lower-dim: #2b3300;

    --neon: #b6ff00;
    --neon-strong: #d9ff66;
    --neon-rgb: 182,255,0;
    --neon-strong-rgb: 217,255,102;
    --danger: #ff5c72;
    --radius: 12px;
    --radius-sm: 8px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 50% -10%, rgba(var(--neon-rgb),0.07), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(var(--neon-rgb),0.05), transparent 40%);
  }
  h1,h2,h3, .display{ font-family: 'Oswald', sans-serif; letter-spacing: 0.01em; }
  ::selection{ background: var(--neon); color: #12150a; }
  .mono{ font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ---- Top bar : logo + nav (with Start alongside Logbook) ---- */
  .topbar{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding: 24px 24px 20px; border-bottom: 1px solid var(--line);
    position: sticky; top:0; z-index: 30; background: rgba(8,9,10,0.94); backdrop-filter: blur(8px);
  }
  .logo-img{ width:100%; max-width: 760px; height:auto; display:block; filter: drop-shadow(0 0 16px rgba(var(--neon-rgb),0.3)); }
  .tagline{ color: #ffffff; font-size: 17px; font-weight:600; letter-spacing: 0.12em; text-transform: uppercase; text-align:center; margin-top: -4px; }
  .nav{ display:flex; align-items:center; gap:10px; margin-top: 4px; flex-wrap:wrap; justify-content:center; }
  .nav-block{
    display:flex; align-items:stretch; border:1px solid var(--line); border-radius: 10px; overflow:hidden; background: var(--panel);
  }
  .nav-block button{
    background: transparent; border:none; border-right: 1px solid var(--line); color: var(--chalk-dim);
    padding: 8px 16px; font: inherit; font-size: 13px; font-weight:600; cursor:pointer; white-space:nowrap;
    transition: all .15s ease;
  }
  .nav-block button:last-child{ border-right:none; }
  .nav-block button.active{ background: var(--neon); color: #171d02; box-shadow:none; }
  .nav-block button:hover:not(.active){ background: var(--panel-3); color: var(--chalk); }
  .nav-block #setupBtn{ color: var(--neon); }
  .nav-block #setupBtn:hover{ background: rgba(var(--neon-rgb),0.08); color: var(--neon); }
  .nav-block #setupBtn.setup-locked{ color: var(--chalk-dim); }

  .start-btn{
    display:inline-flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #1c1e22, #0e0f11);
    border:none; color: var(--neon-strong);
    font: inherit; font-family:'Oswald',sans-serif; font-size: 13px; font-weight:600; letter-spacing:0.05em;
    padding: 8px 18px; cursor:pointer; transition: all .2s ease;
  }
  .start-btn:hover{ background: linear-gradient(135deg, #24272c, #17181b); }

  .session-active{
    display:none; align-items:center; gap:12px;
    background: var(--panel); border: 1px solid var(--upper); border-radius: 100px;
    padding: 7px 8px 7px 16px; box-shadow: 0 0 18px rgba(var(--neon-rgb),0.12);
  }
  .session-active.show{ display:flex; }
  .session-active .label{ display:flex; align-items:center; gap:8px; color: var(--chalk-dim); font-size:12px; }
  .pulse-dot{ width:8px; height:8px; border-radius:50%; background: var(--neon); box-shadow:0 0 10px var(--neon); animation: blink 1.4s ease infinite; }
  @keyframes blink{ 0%,100%{ opacity:1;} 50%{ opacity:.3;} }
  .session-active .clock{ font-size: 15px; color: var(--neon-strong); letter-spacing: 0.03em; }
  .session-active .cancel-link{ background:none; border:1px solid var(--line); color: var(--chalk-faint); font-size:11px; cursor:pointer; padding:6px 12px; border-radius:100px; }
  .session-active .cancel-link:hover{ color: var(--danger); border-color: var(--danger); }

  .logout-btn{
    background: none; border:1px solid var(--line); color: var(--chalk-faint); font:inherit; font-size:12px;
    padding: 9px 16px; border-radius: 100px; cursor:pointer; transition: all .15s ease;
  }
  .logout-btn:hover{ color: var(--danger); border-color: var(--danger); }

  /* ---- Splash / login screen ---- */
  .splash-view{
    min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 40px 24px; text-align:center;
  }
  .splash-view.hide{ display:none; }
  .splash-logo{ width:90%; max-width: 460px; height:auto; margin-bottom: 6px; filter: drop-shadow(0 0 16px rgba(var(--neon-rgb),0.3)); }
  .splash-tagline{ color: var(--chalk-faint); font-size:12px; letter-spacing:.16em; text-transform:uppercase; margin-bottom: 34px; }
  .auth-card{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 28px 26px; width:100%; max-width: 360px; box-shadow: 0 0 40px rgba(0,0,0,0.4);
  }
  .auth-tabs{ display:flex; gap:8px; margin-bottom: 22px; }
  .auth-tab{
    flex:1; background: var(--panel-3); border:1px solid var(--line); color: var(--chalk-dim);
    font:inherit; font-size:13px; font-weight:600; padding: 10px; border-radius: 100px; cursor:pointer; transition: all .15s ease;
  }
  .auth-tab.active{ background: var(--neon); border-color: var(--neon); color: #171d02; }
  .auth-field{ text-align:left; margin-bottom: 14px; }
  .auth-field label{ display:block; font-size:11px; color: var(--chalk-dim); margin-bottom:6px; letter-spacing:.03em; }
  .auth-field input{ padding: 11px 14px; font-size:14px; }
  .auth-submit{ width:100%; margin-top: 6px; }
  .auth-error{ color: var(--danger); font-size:12px; margin-top: 12px; min-height:14px; text-align:left; }
  .auth-note{ color: var(--chalk-faint); font-size:12px; margin-top: 14px; }
  .auth-note button{ background:none; border:none; color: var(--chalk-dim); font:inherit; font-size:12px; text-decoration:underline; cursor:pointer; padding:0; }
  .auth-note button:hover{ color: var(--chalk); }
  .auth-submit[disabled]{ opacity:0.6; cursor:not-allowed; }

  .wrap{ max-width: 1180px; margin: 0 auto; padding: 26px 32px 154px; }
  .view{ display:none; }
  .view.active{ display:block; animation: rise .35s ease; }
  @keyframes rise{ from{ opacity:0; transform: translateY(8px);} to{opacity:1; transform:none;} }

  /* ---- Day rail : always one line, no scroll ---- */
  .day-rail{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:8px; margin-bottom: 16px; }
  .day-tab{
    background: var(--panel); border:1px solid var(--line); color: var(--chalk-dim); font:inherit; font-size:13px;
    padding: 9px 6px; border-radius: 100px; cursor:pointer; transition: all .16s ease; position:relative;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center;
  }
  .day-tab.active{ background: var(--upper-soft); border-color: var(--upper); color: var(--upper); font-weight:600; }
  .day-tab:hover:not(.active){ border-color: var(--chalk-dim); color: var(--chalk); }
  .day-tab .dot{ position:absolute; top:5px; right:10px; width:6px; height:6px; border-radius:50%; background: var(--lower); display:none; box-shadow: 0 0 6px var(--lower); }
  .day-tab.filled .dot{ display:block; }

  /* ---- Week rail : one line, no scroll ---- */
  .week-rail{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:8px; margin-bottom: 18px; }
  .week-tab{
    background: var(--panel); border:1px solid var(--line); color: var(--chalk-dim); font:inherit; font-size:13px;
    padding: 9px 6px; border-radius: 100px; cursor:pointer; transition: all .16s ease; position:relative;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .week-tab.active{ background: var(--lower-soft); border-color: var(--lower); color: var(--lower); font-weight:600; }
  .week-tab.done::after{ content:'✓'; margin-left:5px; color: var(--neon); }
  .week-tab:hover:not(.active){ border-color: var(--chalk-dim); color: var(--chalk); }

  /* ---- Header row : title/type/date as compact pill tags, always one line ---- */
  .day-header{
    display:flex; flex-wrap:nowrap; gap:8px; margin-bottom: 16px;
  }
  .field{ display:flex; flex-direction:column; gap:1px; }
  .field label{ font-size: 9px; color: var(--chalk-dim); letter-spacing:.05em; text-transform:uppercase; line-height:1.2; }
  .day-header .field{
    flex:1; min-width:0; flex-direction:row; align-items:center; gap:8px;
    background: var(--panel-2); border:1px solid var(--line); border-radius: 100px;
    padding: 9px 16px; transition: border-color .15s ease;
  }
  .day-header .field:focus-within{ border-color: var(--chalk-dim); }
  .day-header .field label{ margin:0; flex-shrink:0; color: var(--chalk-faint); }
  .day-header .field input, .day-header .field select{
    background: transparent; border:none; padding:0; min-width:0; font-size:13px;
  }
  .day-header .field select{ background-image:none; padding-right:14px; appearance:auto; -webkit-appearance:menulist; }
  .day-header .field input:focus, .day-header .field select:focus{ box-shadow:none; }
  input, select{
    width:100%; background: var(--panel-3); border:1px solid var(--line); color: var(--chalk);
    padding: 3px 10px; border-radius: var(--radius-sm); font: inherit; font-size: 13px; line-height:1.4;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select{
    appearance: none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0L5 6L10 0Z' fill='%23888d90'/></svg>");
    background-repeat:no-repeat; background-position: right 14px center; padding-right: 34px;
  }
  input:hover, select:hover{ border-color: var(--chalk-faint); }
  input:focus, select:focus, button:focus-visible{ outline: none; border-color: var(--neon); box-shadow: 0 0 0 3px rgba(var(--neon-rgb),0.15); }
  input::placeholder{ color: #52565a; }
  select:disabled, input:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ---- Columns ---- */
  .columns{ display:grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .columns.single{ grid-template-columns: 1fr; }
  @media (max-width: 880px){ .columns{ grid-template-columns: 1fr; } }

  .col-head{ display:flex; align-items:center; gap:10px; margin-bottom: 14px; }
  .col-head .bar{ width:4px; height: 22px; border-radius: 4px; }
  .col-head.upper .bar{ background: var(--upper); box-shadow: 0 0 8px var(--upper); }
  .col-head.lower .bar{ background: var(--lower); box-shadow: 0 0 8px var(--lower); }
  .col-head h2{ font-size: 19px; margin:0; }
  .col-head .count{ margin-left:auto; font-size: 12px; color: var(--chalk-dim); }

  .slot{
    position:relative; overflow:visible;
    background: var(--panel); border:1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px; transition: border-color .2s ease, box-shadow .2s ease;
  }
  .slot.upper.active{ border-left-color: var(--upper); box-shadow: -3px 0 14px -8px var(--upper); }
  .slot.lower.active{ border-left-color: var(--lower); box-shadow: -3px 0 14px -8px var(--lower); }
  .slot.celebrate{ animation: slotCelebrate 1s ease; }
  @keyframes slotCelebrate{ 0%{ box-shadow:0 0 0 rgba(var(--neon-rgb),0);} 30%{ box-shadow:0 0 40px rgba(var(--neon-rgb),0.55);} 100%{ box-shadow:0 0 0 rgba(var(--neon-rgb),0);} }

  /* ---- Compact exercise row (shown once day setup is locked) ---- */
  .slot-compact{
    display:flex; align-items:center; gap:12px;
    background: var(--panel); border:1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: var(--radius); padding: 13px 14px; margin-bottom: 8px; cursor:pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .slot-compact:hover{ border-color: var(--chalk-dim); transform: translateX(1px); }
  .slot-compact:active{ transform: translateX(0) scale(.99); }
  .slot-compact.upper{ border-left-color: var(--upper); }
  .slot-compact.lower{ border-left-color: var(--lower); }
  .slot-compact .sc-dot{ width:8px; height:8px; border-radius:50%; background: var(--panel-3); border:1px solid var(--line); flex-shrink:0; }
  .slot-compact.done .sc-dot{ background: var(--neon); border-color: var(--neon); box-shadow: 0 0 8px var(--neon); }
  .slot-compact .sc-name{ flex:1; font-size:14px; font-weight:600; color: var(--chalk); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .slot-compact .sc-summary{ font-size:11px; color: var(--chalk-faint); font-family:'JetBrains Mono',monospace; flex-shrink:0; max-width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .slot-compact .sc-chev{ color: var(--chalk-faint); font-size:16px; flex-shrink:0; }
  .slot-top{ display:flex; align-items:center; gap:10px; margin-bottom: 10px; }
  .slot-top select{ flex:1; }

  .custom-ex-row{ display:flex; gap:8px; margin: 0 0 12px 0; }
  .custom-ex-row input{ flex:1; }
  .custom-ex-back{
    background: var(--panel-3); border:1px solid var(--line); color: var(--chalk-dim); border-radius: var(--radius-sm);
    padding: 0 14px; cursor:pointer; font-size:13px;
  }
  .custom-ex-back:hover{ color: var(--chalk); border-color: var(--chalk-dim); }

  .slot-grid{ display:grid; grid-template-columns: 0.55fr 1.1fr; gap: 10px; align-items:start; }
  .slot-grid .field label{ font-size: 11px; }
  .slot-grid input[type="number"]{ text-align:center; }

  .log-field{ display:flex; flex-direction:column; gap:6px; }
  .log-sets-btn{
    background: var(--panel-3); border:1px solid var(--upper); color: var(--upper);
    padding: 10px 10px; border-radius: var(--radius-sm); font:inherit; font-size:12px; font-weight:700; cursor:pointer; transition: all .15s ease;
  }
  .slot.lower .log-sets-btn{ border-color: var(--lower); color: var(--lower); }
  .log-sets-btn:hover{ background: rgba(var(--neon-rgb),0.08); }
  .sets-summary{ font-size:11px; color: var(--chalk-dim); line-height:1.4; }

  .prev-reps{ margin-top:2px; font-size:11px; color: var(--chalk-faint); display:flex; align-items:center; gap:5px; }
  .prev-reps .tag{ background: var(--panel-3); border:1px solid var(--line); border-radius:4px; padding:1px 6px; color: var(--chalk-dim); font-family:'JetBrains Mono',monospace; }

  /* ---- Finish bar ---- */
  .finish-bar{
    position: sticky; bottom: 64px; margin-top: 15px; padding: 10px 20px; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.45); gap:8px;
  }
  .finish-bar .session-total{ display:flex; align-items:center; gap:6px; color: var(--chalk-dim); font-size:12px; }
  .finish-bar .session-total .clock-sm{ color: var(--neon-strong); font-size:14px; }
  .finish-actions{ display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px; width:100%; flex-wrap:wrap; }
  .finish-actions .btn-primary{ flex:1; max-width:200px; text-align:center; padding: 9px 20px; font-size:14px; }
  .mode-btn{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:8px;
    background: var(--panel-3); border:1px solid var(--line); color: var(--chalk);
    font: inherit; font-weight:700; font-size:14px; padding: 9px 18px; border-radius: var(--radius-sm);
    cursor:pointer; transition: all .15s ease;
  }
  .mode-btn:hover{ border-color: var(--chalk-dim); background: var(--panel-2); }
  .mode-dot{ width:13px; height:13px; border-radius:50%; background: var(--neon); box-shadow:0 0 8px var(--neon); flex-shrink:0; }
  .btn-primary{
    background: linear-gradient(135deg, var(--neon), #8fcb00); border:none; color: #171d02; font: inherit;
    font-weight:700; font-size: 15px; padding: 13px 28px; border-radius: var(--radius-sm); cursor:pointer; transition: transform .12s ease, box-shadow .12s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 6px 22px rgba(var(--neon-rgb),0.4); }
  .btn-primary:active{ transform: translateY(0); }
  .btn-ghost{
    background: var(--panel-3); border:1px solid var(--line); color: var(--chalk-dim); font:inherit; font-size:13px;
    padding: 10px 18px; border-radius: var(--radius-sm); cursor:pointer; transition: all .15s ease;
  }
  .btn-ghost:hover{ color: var(--chalk); border-color: var(--chalk-dim); }

  /* ---- Confetti (shared) ---- */
  .confetti-dot{ position:absolute; width:7px; height:7px; border-radius:2px; pointer-events:none; z-index:5; }
  .confetti-dot.pop{ animation: confettiPop .85s ease forwards; }
  @keyframes confettiPop{ to{ transform: translate(var(--dx), var(--dy)) rotate(220deg) scale(.35); opacity:0; } }
  .confetti-dot.rain{ animation: confettiRain 1.9s ease-in forwards; top:-10px; }
  @keyframes confettiRain{ to{ transform: translateY(380px) rotate(300deg); opacity:0; } }

  /* ---- Unified Exercise popup (set check-off + rest timer) ---- */
  .ex-modal-overlay{
    position:fixed; inset:0; background:rgba(3,4,4,0.82); backdrop-filter: blur(5px);
    display:none; align-items:center; justify-content:center; z-index:110; padding:20px;
  }
  .ex-modal-overlay.show{ display:flex; animation: fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ from{ transform:scale(.86); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .ex-modal{
    position:relative; overflow:hidden;
    background: var(--panel); border:1px solid var(--upper); border-radius: 22px; padding: 20px 22px 18px;
    width:100%; max-width: 400px; max-height: 94vh; overflow-y:auto;
    box-shadow: 0 0 55px rgba(var(--neon-rgb),0.22); animation: popIn .22s ease;
    transition: border-color .3s ease, box-shadow .3s ease;
    display:flex; flex-direction:column;
  }
  .ex-modal.all-done{ border-color: var(--neon-strong); box-shadow: 0 0 80px rgba(var(--neon-rgb),0.45); }
  .ex-modal-close{
    position:absolute; top:12px; right:14px; background:none; border:none; color: var(--chalk-faint);
    font-size:22px; line-height:1; cursor:pointer; z-index:3;
  }
  .ex-modal-close:hover{ color: var(--danger); }
  .ex-modal .eyebrow{ font-size:11px; letter-spacing:.14em; color: var(--chalk-faint); text-transform:uppercase; text-align:center; margin-bottom:6px; }
  .ex-modal-title{ text-align:center; font-family:'Oswald',sans-serif; font-size:19px; color: var(--chalk); margin-bottom: 12px; }

  .ex-set-rows{ display:flex; flex-direction:column; gap:6px; max-height: 34vh; overflow-y:auto; margin-bottom: 8px; padding-right:2px; }
  .ex-set-row{ display:grid; grid-template-columns: 30px 1fr 1fr 24px; gap:8px; align-items:center; padding:5px; border-radius:8px; border:1px solid transparent; transition: all .2s ease; }
  .ex-set-row.checked{ background: rgba(var(--neon-rgb),0.08); border-color: rgba(var(--neon-rgb),0.28); }
  .ex-set-row input{ padding: 9px 8px; font-size:13px; text-align:center; }
  .ex-check{ background: var(--panel-3); cursor:pointer; padding:0; font-family:inherit;
    width:26px; height:26px; border-radius:50%; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:11px; color: var(--chalk-dim); transition: all .2s ease;
  }
  .ex-check.checked{ background: var(--neon); border-color: var(--neon); color:#171d02; font-weight:700; box-shadow: 0 0 10px rgba(var(--neon-rgb),0.55); }
  .ex-row-remove{ background:none; border:none; color: var(--chalk-faint); font-size:16px; cursor:pointer; line-height:1; }
  .ex-row-remove:hover{ color: var(--danger); }
  #exAddSetBtn{ width:100%; margin-bottom: 12px; padding: 8px 18px; }

  .ex-rest-zone{ border-top:1px solid var(--line); padding-top:12px; text-align:center; }
  .ex-timer-popup{ display:none; }
  .ex-timer-popup.show{ display:block; animation: popIn .18s ease; }
  #exFinishBtn{ width:100%; margin-top:12px; }
  .ex-rest-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .ex-rest-label{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color: var(--chalk-faint); }
  .ex-rest-input-row{ display:flex; align-items:center; gap:6px; }
  .ex-rest-input-row input{ width:64px; padding:7px 8px; text-align:center; font-size:13px; }
  .ex-rest-suffix{ font-size:11px; color: var(--chalk-faint); }

  .analog-clock{
    width:108px; height:108px; border-radius:50%; margin: 0 auto 8px; position:relative;
    border: 3px solid var(--neon); box-shadow: 0 0 28px rgba(var(--neon-rgb),0.28), inset 0 0 20px rgba(var(--neon-rgb),0.08);
    background: radial-gradient(circle, rgba(var(--neon-rgb),0.05), transparent 70%);
  }
  .analog-clock.urgent{ animation: urgentBlink 0.6s ease infinite; }
  @keyframes urgentBlink{
    0%,100%{ box-shadow: 0 0 28px rgba(var(--neon-rgb),0.28), inset 0 0 20px rgba(var(--neon-rgb),0.08); }
    50%{ box-shadow: 0 0 55px rgba(var(--neon-strong-rgb),0.95), 0 0 90px rgba(var(--neon-rgb),0.55); }
  }
  .analog-clock .ring-progress{
    position:absolute; inset:4px; border-radius:50%; z-index:0; opacity:0.85;
    background: conic-gradient(var(--neon) 0deg, transparent 0deg);
    transition: background 1s linear;
  }
  .analog-clock .hand{
    position:absolute; bottom:50%; left:50%; width:3px; height:42px; background: var(--neon-strong);
    transform-origin: bottom center; transform: translateX(-50%) rotate(0deg); border-radius:2px;
    box-shadow: 0 0 10px var(--neon); transition: transform 1s linear; z-index:1;
  }
  .analog-clock .center-dot{
    position:absolute; top:50%; left:50%; width:10px; height:10px; background: var(--neon-strong);
    border-radius:50%; transform:translate(-50%,-50%); box-shadow: 0 0 10px var(--neon); z-index:2;
  }
  .ex-rest-zone .digital-readout{ font-size: 22px; color: var(--neon-strong); letter-spacing: 0.04em; text-shadow: 0 0 16px rgba(var(--neon-rgb),0.4); margin-bottom: 2px; }

  .timer-btn-wide{
    margin-top:8px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:transparent; border:2px solid var(--upper); color: var(--upper);
    padding:10px; border-radius:100px; font:inherit; font-weight:700; font-size:13px; cursor:pointer; transition: all .15s ease;
  }
  .timer-btn-wide:hover{ background: rgba(var(--neon-rgb),0.08); }
  .timer-btn-wide.running{ animation: ringPulse 1.4s ease infinite; }
  @keyframes ringPulse{ 0%,100%{ box-shadow:0 0 6px rgba(var(--neon-rgb),0.25);} 50%{ box-shadow:0 0 16px rgba(var(--neon-rgb),0.6);} }
  .timer-btn-wide svg{ width:16px; height:16px; }

  /* ---- Workout summary popup ---- */
  .summary-modal-overlay{
    position:fixed; inset:0; background:rgba(3,4,4,0.85); backdrop-filter: blur(6px);
    display:none; align-items:center; justify-content:center; z-index:120; padding:20px;
  }
  .summary-modal-overlay.show{ display:flex; animation: fadeIn .25s ease; }
  .summary-modal{
    position:relative; overflow:hidden auto; background: var(--panel); border:1px solid var(--neon);
    border-radius: 24px; padding: 34px 30px 28px; width:100%; max-width: 460px; max-height: 86vh;
    box-shadow: 0 0 70px rgba(var(--neon-rgb),0.28); animation: popIn .3s ease;
  }
  .confetti-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
  .summary-header{ position:relative; z-index:2; text-align:center; margin-bottom: 22px; }
  .summary-emoji{ font-size:42px; margin-bottom:4px; }
  .summary-header h2{ margin:0 0 6px; font-size:26px; color: var(--neon-strong); text-shadow: 0 0 20px rgba(var(--neon-rgb),0.4); }
  .summary-sub{ color: var(--chalk-dim); font-size:13px; }
  .summary-stats{ position:relative; z-index:2; display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom: 22px; }
  .stat-card{ background: var(--panel-3); border:1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 6px; text-align:center; }
  .stat-val{ font-size:19px; color: var(--neon-strong); }
  .stat-lbl{ font-size:10px; color: var(--chalk-dim); margin-top:4px; letter-spacing:.02em; }
  .summary-exercises{ position:relative; z-index:2; margin-bottom: 22px; }
  .summary-exercises h4{ font-size:11px; letter-spacing:.08em; color: var(--chalk-faint); margin: 14px 0 8px; }
  .summary-exercises h4:first-child{ margin-top:0; }
  .summary-ex-item{ background: var(--panel-3); border:1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px; }
  .summary-ex-head{ display:flex; align-items:center; gap:8px; }
  .summary-ex-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .summary-ex-dot.upper{ background: var(--upper); box-shadow:0 0 6px var(--upper); }
  .summary-ex-dot.lower{ background: var(--lower); box-shadow:0 0 6px var(--lower); }
  .summary-ex-name{ flex:1; font-size:14px; color: var(--chalk); }
  .summary-ex-vol{ font-size:13px; color: var(--neon-strong); }
  .summary-ex-sets{ font-size:12px; color: var(--chalk-dim); margin: 5px 0 4px 16px; }
  .summary-ex-compare{ font-size:11px; margin-left:16px; }
  .cmp-up{ color: var(--neon-strong); }
  .cmp-down{ color: var(--lower); }
  .cmp-flat, .cmp-new{ color: var(--chalk-faint); }
  #summaryCloseBtn{ position:relative; z-index:2; width:100%; }

  /* ---- Mode / theme picker popup ---- */
  .theme-modal-overlay{
    position:fixed; inset:0; background:rgba(3,4,4,0.85); backdrop-filter: blur(6px);
    display:none; align-items:center; justify-content:center; z-index:140; padding:20px;
  }
  .theme-modal-overlay.show{ display:flex; animation: fadeIn .2s ease; }
  .theme-modal{
    position:relative; background: var(--panel); border:1px solid var(--line); border-radius:24px;
    padding: 30px 26px 34px; width:100%; max-width:360px; text-align:center;
    box-shadow: 0 0 60px rgba(0,0,0,0.55); animation: popIn .25s ease;
  }
  .theme-modal .eyebrow{ font-size:11px; letter-spacing:.14em; color: var(--chalk-faint); text-transform:uppercase; margin-bottom:4px; }
  .theme-modal-title{ font-family:'Oswald',sans-serif; font-size:21px; margin: 2px 0 26px; color: var(--chalk); }
  .color-wheel-wrap{ position:relative; width:260px; height:260px; margin:0 auto; }
  .color-wheel-ring{
    position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from 0deg, #ff005c, #ff9a00, #f9f002, #7bff00, #00ff85, #00fff7, #00aaff, #7b2bff, #ff00e6, #ff005c);
    filter: blur(3px) saturate(1.3);
    animation: wheelSpin 14s linear infinite;
    opacity:0.5;
  }
  @keyframes wheelSpin{ to{ transform: rotate(360deg); } }
  .color-wheel{ position:absolute; inset:0; }
  .color-swatch{
    position:absolute; width:44px; height:44px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.18); cursor:pointer; transform: translate(-50%,-50%);
    box-shadow: 0 0 14px rgba(0,0,0,0.5); transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .color-swatch:hover{ transform: translate(-50%,-50%) scale(1.15); border-color: rgba(255,255,255,0.7); }
  .color-swatch.active{ border-color:#fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.3), 0 0 22px currentColor; }
  .color-wheel-center{
    position:absolute; top:50%; left:50%; width:92px; height:92px; transform:translate(-50%,-50%);
    border-radius:50%; background: var(--panel); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif;
    font-size:12px; letter-spacing:.03em; color: var(--chalk-dim); text-align:center; padding:8px;
  }

  /* ---- Logbook ---- */
  .log-empty{ text-align:center; padding: 90px 20px; color: var(--chalk-dim); }
  .log-empty .display{ font-size: 20px; color: var(--chalk); margin-bottom: 8px; }
  .log-entry{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow:hidden;
  }
  .log-entry-head{ display:flex; align-items:center; gap:14px; padding: 18px 20px; cursor:pointer; }
  .log-entry-head .date-badge{
    font-family:'Oswald',sans-serif; background: var(--panel-3); border:1px solid var(--line); border-radius:8px;
    padding: 8px 12px; text-align:center; min-width: 64px;
  }
  .date-badge .d{ font-size:20px; line-height:1; }
  .date-badge .m{ font-size:11px; color: var(--chalk-dim); letter-spacing:.06em; }
  .log-entry-head .meta{ flex:1; }
  .log-entry-head .meta h3{ margin:0 0 3px; font-size:16px; display:flex; align-items:center; gap:8px; }
  .wk-pill{ font-family:'Inter',sans-serif; font-size:11px; font-weight:700; color: var(--lower); background: var(--lower-soft); border:1px solid var(--lower); border-radius:100px; padding:2px 9px; }
  .log-entry-head .meta .tags{ color: var(--chalk-dim); font-size: 13px; }
  .log-entry-head .chev{ color: var(--chalk-dim); transition: transform .2s ease; }
  .log-entry.open .chev{ transform: rotate(180deg); }
  .log-entry-body{ display:none; padding: 0 20px 20px; }
  .log-entry.open .log-entry-body{ display:block; animation: rise .25s ease; }
  .log-cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:700px){ .log-cols{ grid-template-columns:1fr; } }
  .log-cols h4{ font-size:12px; color: var(--chalk-dim); letter-spacing:.06em; margin: 0 0 8px; }
  .log-ex{ display:flex; justify-content:space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; gap:10px; }
  .log-ex:last-child{ border-bottom:none; }
  .log-ex .name{ color: var(--chalk); }
  .log-ex .stat{ color: var(--chalk-dim); font-variant-numeric: tabular-nums; font-family:'JetBrains Mono',monospace; font-size:12px; text-align:right; }
  .log-actions{ display:flex; justify-content:flex-end; margin-top: 12px; }

  .toast{
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--neon); color: #171d02; padding: 14px 22px; border-radius: 20px; font-weight:700;
    font-size: 13px; line-height:1.4; max-width: min(92vw, 420px); text-align:center;
    opacity:0; pointer-events:none; transition: all .3s ease; z-index: 130; box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 22px rgba(var(--neon-rgb),0.4);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ width:10px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 10px; }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="splash-view" id="splashView">
  <img class="splash-logo" id="splashLogo" src="" alt="RepLog logo">
  <div class="splash-tagline">4-Week Local Training Log</div>
  <div class="auth-card">

      <button type="submit" class="btn-primary auth-submit" id="authSubmitBtn">Log In</button>
      <div class="auth-error" id="authError"></div>

<script>
/* ---------------------------------------------------------
   EXERCISE LIBRARY
--------------------------------------------------------- */
const UPPER_LIBRARY = {
  "Chest": ["Barbell Bench Press","Incline Barbell Bench Press","Decline Barbell Bench Press","Dumbbell Bench Press","Incline Dumbbell Press","Decline Dumbbell Press","Dumbbell Fly","Incline Dumbbell Fly","Cable Fly (Mid)","Cable Fly (Low-to-High)","Cable Fly (High-to-Low)","Pec Deck Machine","Chest Press Machine","Push-Up","Incline Push-Up","Decline Push-Up","Dips (Chest Focus)","Landmine Press","Svend Press"],
  "Back": ["Pull-Up","Chin-Up","Lat Pulldown (Wide Grip)","Lat Pulldown (Close Grip)","Barbell Bent-Over Row","Pendlay Row","T-Bar Row","Seated Cable Row","Single-Arm Dumbbell Row","Chest-Supported Row","Inverted Row","Straight-Arm Pulldown","Face Pull","Rack Pull","Meadows Row","Machine Row"],
  "Shoulders": ["Overhead Barbell Press","Seated Dumbbell Shoulder Press","Arnold Press","Push Press","Dumbbell Lateral Raise","Cable Lateral Raise","Front Raise","Rear Delt Fly (Dumbbell)","Rear Delt Fly (Cable)","Reverse Pec Deck","Upright Row","Machine Shoulder Press","Cuban Press","Bradford Press"],
  "Biceps": ["Barbell Curl","EZ-Bar Curl","Dumbbell Curl","Alternating Dumbbell Curl","Hammer Curl","Incline Dumbbell Curl","Preacher Curl","Concentration Curl","Cable Curl","Cable Rope Hammer Curl","Spider Curl","Drag Curl","21s"],
  "Triceps": ["Close-Grip Bench Press","Tricep Pushdown (Rope)","Tricep Pushdown (Bar)","Overhead Tricep Extension (Dumbbell)","Overhead Tricep Extension (Cable)","Skull Crushers","Dips (Triceps Focus)","Tricep Kickback","Diamond Push-Up","JM Press","Tate Press"],
  "Forearms": ["Wrist Curl","Reverse Wrist Curl","Reverse Curl","Farmer's Carry","Plate Pinch Hold","Wrist Roller"],
  "Traps": ["Barbell Shrug","Dumbbell Shrug","Trap Bar Shrug","Cable Shrug","High Pull"]
};

const LOWER_LIBRARY = {
  "Quadriceps": ["Back Squat","Front Squat","Goblet Squat","Hack Squat","Leg Press","Bulgarian Split Squat","Walking Lunge","Reverse Lunge","Step-Up","Leg Extension","Sissy Squat","Zercher Squat","Box Squat"],
  "Hamstrings": ["Romanian Deadlift","Stiff-Leg Deadlift","Conventional Deadlift","Seated Leg Curl","Lying Leg Curl","Nordic Hamstring Curl","Good Morning","Glute-Ham Raise","Single-Leg RDL","Cable Pull-Through"],
  "Glutes": ["Hip Thrust","Glute Bridge","Cable Glute Kickback","Sumo Deadlift","Frog Pump","Curtsy Lunge","Single-Leg Hip Thrust","Donkey Kick"],
  "Calves": ["Standing Calf Raise","Seated Calf Raise","Leg Press Calf Raise","Donkey Calf Raise","Single-Leg Calf Raise"],
  "Adductors / Abductors": ["Cable Hip Adduction","Cable Hip Abduction","Machine Hip Adduction","Machine Hip Abduction","Lateral Band Walk","Copenhagen Plank","Sumo Squat"],
  "Full Lower / Compound": ["Barbell Squat (High Bar)","Barbell Squat (Low Bar)","Trap Bar Deadlift","Kettlebell Swing","Wall Sit","Broad Jump","Box Jump"]
};

function buildOptions(library){
  let html = '<option value="">— Select exercise —</option>';
  for(const group in library){
    html += `<optgroup label="${group}">`;
    library[group].forEach(ex => html += `<option value="${ex}">${ex}</option>`);
    html += `</optgroup>`;
  }
  html += `<option value="__custom__">+ Add your own exercise…</option>`;
  return html;
}
const UPPER_OPTIONS_HTML = buildOptions(UPPER_LIBRARY);
const LOWER_OPTIONS_HTML = buildOptions(LOWER_LIBRARY);
const CLOCK_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.2 2"></path></svg>`;

/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
const DAY_COUNT = 4;
const SLOTS_PER_SIDE = 5;
const WEEK_COUNT = 4;
let currentUserId = null;

function emptySlotDef(){ return { exercise:"", sets:"", rest:"", custom:false }; }
function emptyWeek(){
  return {
    date:"",
    logs: {
      upper: Array.from({length:SLOTS_PER_SIDE}, () => []),
      lower: Array.from({length:SLOTS_PER_SIDE}, () => [])
    }
  };
}
function emptyDay(){
  return {
    title:"", type:"",
    upper: Array.from({length:SLOTS_PER_SIDE}, emptySlotDef),
    lower: Array.from({length:SLOTS_PER_SIDE}, emptySlotDef),
    weeks: Array.from({length:WEEK_COUNT}, emptyWeek),
    currentWeek: 1,
    setupComplete: false,
    timerStart: null,
    timerElapsed: 0
  };
}
function freshDays(){ return Array.from({length:DAY_COUNT}, emptyDay); }
function isValidDaysShape(parsed){
  return Array.isArray(parsed) && parsed.length && parsed[0].weeks && parsed[0].weeks[0] && parsed[0].weeks[0].logs;
}
function normalizeDaysLength(parsed){
  if(parsed.length > DAY_COUNT) return parsed.slice(0, DAY_COUNT);
  if(parsed.length < DAY_COUNT) return parsed.concat(Array.from({length: DAY_COUNT - parsed.length}, emptyDay));
  return parsed;
}

/* ---- Cloud persistence (Supabase) ---- */
async function loadDaysFromCloud(){
  if(!currentUserId) return freshDays();
  try{
    const { data, error } = await supabaseClient
      .from('program_state')
      .select('days')
      .eq('user_id', currentUserId)
      .maybeSingle();
    if(error) throw error;
    if(data && data.days && isValidDaysShape(data.days)) return normalizeDaysLength(data.days);
  }catch(e){ console.error('loadDaysFromCloud failed', e); }
  return freshDays();
}
async function saveDaysToCloud(){
  if(!currentUserId) return;
  try{
    const { error } = await supabaseClient
      .from('program_state')
      .upsert({ user_id: currentUserId, days, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
    if(error) throw error;
  }catch(e){ console.error('saveDaysToCloud failed', e); showToast("Sync error: " + (e && (e.message || e.details || JSON.stringify(e))), 8000); }
}
let saveDaysTimer = null;
function saveDays(){
  clearTimeout(saveDaysTimer);
  saveDaysTimer = setTimeout(saveDaysToCloud, 700);
}
function flushSaveDays(){
  clearTimeout(saveDaysTimer);
  saveDaysToCloud();
}

/* ---------------------------------------------------------
   HELPERS: sets/reps/volume formatting
--------------------------------------------------------- */
function formatLogSummary(log){
  if(!log || log.length === 0) return 'Not logged yet';
  return log.map(r => {
    const reps = (r.reps !== "" && r.reps != null) ? r.reps : '-';
    const weight = r.weight ? `×${r.weight}` : '';
    return `${reps}${weight}`;
  }).join(', ');
}
function calcVolume(log){
  return (log||[]).reduce((sum,r) => sum + ((parseFloat(r.reps)||0) * (parseFloat(r.weight)||0)), 0);
}
function formatMMSS(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}
function formatHMS(totalSeconds){
  const h = Math.floor(totalSeconds/3600).toString().padStart(2,'0');
  const m = Math.floor((totalSeconds%3600)/60).toString().padStart(2,'0');
  const s = Math.floor(totalSeconds%60).toString().padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6 — bright ascending chime
    notes.forEach((freq, i) => {
      const t0 = ctx.currentTime + i * 0.11;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, t0);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.85);
      o.start(t0); o.stop(t0 + 0.9);
    });
    const shimmer = ctx.createOscillator();
    const shimmerGain = ctx.createGain();
    shimmer.type = 'triangle';
    shimmer.frequency.setValueAtTime(1568, ctx.currentTime + 0.33);
    shimmer.connect(shimmerGain); shimmerGain.connect(ctx.destination);
    shimmerGain.gain.setValueAtTime(0.0001, ctx.currentTime + 0.33);
    shimmerGain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.35);
    shimmerGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
    shimmer.start(ctx.currentTime + 0.33); shimmer.stop(ctx.currentTime + 1.2);
  }catch(e){}
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function showToast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timeout);
  showToast._timeout = setTimeout(() => t.classList.remove('show'), duration || 3200);
}
function spawnConfetti(container, opts){
  const { count = 20, mode = 'pop' } = opts || {};
  const rootStyle = getComputedStyle(document.documentElement);
  const neon = (rootStyle.getPropertyValue('--neon') || '#b6ff00').trim();
  const neonStrong = (rootStyle.getPropertyValue('--neon-strong') || '#d9ff66').trim();
  const colors = [neon, neonStrong, '#ffffff', neon];
  for(let i=0; i<count; i++){
    const dot = document.createElement('span');
    dot.className = 'confetti-dot ' + mode;
    dot.style.background = colors[Math.floor(Math.random()*colors.length)];
    if(mode === 'rain'){
      dot.style.left = Math.random()*100 + '%';
      dot.style.animationDelay = (Math.random()*0.5) + 's';
    } else {
      const angle = Math.random()*360, dist = 30 + Math.random()*70;
      dot.style.setProperty('--dx', (Math.cos(angle*Math.PI/180)*dist) + 'px');
      dot.style.setProperty('--dy', (Math.sin(angle*Math.PI/180)*dist) + 'px');
      dot.style.left = '50%'; dot.style.top = '50%';
    }
    container.appendChild(dot);
    setTimeout(() => dot.remove(), mode === 'rain' ? 2000 : 900);
  }
}

--------------------------------------------------------- */
const upperSlotsEl = document.getElementById('upperSlots');
const lowerSlotsEl = document.getElementById('lowerSlots');

function renderSlots(){
  upperSlotsEl.innerHTML = "";
  lowerSlotsEl.innerHTML = "";
  const d = days[activeDay];

  const upperEntries = d.upper.map((slot,i) => ({slot,i})).filter(o => !d.setupComplete || o.slot.exercise);
  const lowerEntries = d.lower.map((slot,i) => ({slot,i})).filter(o => !d.setupComplete || o.slot.exercise);

  upperEntries.forEach(o => upperSlotsEl.appendChild(d.setupComplete ? buildSlotCompactEl('upper', o.i, o.slot) : buildSlotEl('upper', o.i, o.slot)));
  lowerEntries.forEach(o => lowerSlotsEl.appendChild(d.setupComplete ? buildSlotCompactEl('lower', o.i, o.slot) : buildSlotEl('lower', o.i, o.slot)));

  const hideUpper = d.setupComplete && upperEntries.length === 0;
  const hideLower = d.setupComplete && lowerEntries.length === 0;
  document.getElementById('upperColumn').style.display = hideUpper ? 'none' : '';
  document.getElementById('lowerColumn').style.display = hideLower ? 'none' : '';
  document.getElementById('columnsWrap').classList.toggle('single', hideUpper || hideLower);

  updateCounts();
}

function buildSlotEl(side, index, slot){
  const wrap = document.createElement('div');
  wrap.className = `slot ${side}` + (slot.exercise ? ' active' : '');
  wrap.dataset.side = side;
  wrap.dataset.index = index;

  const optionsHtml = side === 'upper' ? UPPER_OPTIONS_HTML : LOWER_OPTIONS_HTML;

  wrap.innerHTML = `
    <div class="slot-top">
      <select class="ex-select">${optionsHtml}</select>
    </div>
    <div class="custom-ex-row" style="display:none;">
      <input type="text" class="custom-ex-input" placeholder="Type your exercise name">
      <button type="button" class="custom-ex-back" title="Back to list">↩</button>
    </div>
  `;

  const select = wrap.querySelector('.ex-select');
  const customRow = wrap.querySelector('.custom-ex-row');
  const customInput = wrap.querySelector('.custom-ex-input');
  const customBack = wrap.querySelector('.custom-ex-back');

  if(slot.custom && slot.exercise){
    select.value = '__custom__';
    customRow.style.display = 'flex';
    customInput.value = slot.exercise;
  } else {
    select.value = slot.exercise;
  }

  select.addEventListener('change', () => {
    if(select.value === '__custom__'){
      days[activeDay][side][index].custom = true;
      days[activeDay][side][index].exercise = customInput.value.trim();
      customRow.style.display = 'flex';
      customInput.focus();
    } else {
      days[activeDay][side][index].custom = false;
      days[activeDay][side][index].exercise = select.value;
      customRow.style.display = 'none';
    }
    wrap.classList.toggle('active', !!days[activeDay][side][index].exercise);
    saveDays(); renderDayRail(); updateCounts();
  });

  customInput.addEventListener('input', () => {
    days[activeDay][side][index].exercise = customInput.value.trim();
    wrap.classList.toggle('active', !!customInput.value.trim());
    saveDays(); renderDayRail(); updateCounts();
  });

  customBack.addEventListener('click', () => {
    days[activeDay][side][index].custom = false;
    days[activeDay][side][index].exercise = "";
    customInput.value = "";
    customRow.style.display = 'none';
    select.value = "";
    wrap.classList.remove('active');
    saveDays(); renderDayRail(); updateCounts();
  });

  return wrap;
}

function buildSlotCompactEl(side, index, slot){
  const d = days[activeDay];
  const cw = d.currentWeek;
  const currentLog = d.weeks[cw-1].logs[side][index] || [];
  const done = currentLog.length > 0 && currentLog.every(r => r.reps !== "" && r.reps != null);

  const wrap = document.createElement('div');
  wrap.className = `slot-compact ${side}` + (done ? ' done' : '');
  wrap.innerHTML = `
    <span class="sc-dot"></span>
    <span class="sc-name">${escapeHtml(slot.exercise || 'Exercise')}</span>
    <span class="sc-summary mono">${escapeHtml(formatLogSummary(currentLog))}</span>
    <span class="sc-chev">›</span>
  `;
  wrap.addEventListener('click', () => openExerciseModal(side, index));
  return wrap;
}

function updateCounts(){
  const d = days[activeDay];
  const upperFilled = d.upper.filter(s => s.exercise).length;
  const lowerFilled = d.lower.filter(s => s.exercise).length;
  document.getElementById('upperCount').textContent = `${upperFilled} / 5 logged`;
  document.getElementById('lowerCount').textContent = `${lowerFilled} / 5 logged`;
}

const exModalOverlay = document.getElementById('exModalOverlay');

const exTimerPopup = document.getElementById('exTimerPopup');
const analogClock = document.getElementById('analogClock');
const ringProgress = document.getElementById('ringProgress');
const restHand = document.getElementById('restHand');
const restDigital = document.getElementById('restDigital');

let exModalSide = null, exModalIndex = null, exModalRowsData = [], exModalCelebrated = false;
let exRestInterval = null;

function setTimerLabel(text){
  exTimerBtn.innerHTML = CLOCK_ICON_SVG + `<span class="tb-label">${text}</span>`;
}
setTimerLabel('Start Rest');

function resetTimerVisual(){
  if(exRestInterval){ clearInterval(exRestInterval); exRestInterval = null; }
  exTimerBtn.classList.remove('running');
  setTimerLabel('Start Rest');
  restDigital.textContent = '00:00';
  ringProgress.style.background = 'conic-gradient(var(--neon) 0deg, transparent 0deg)';
  restHand.style.transform = 'translateX(-50%) rotate(0deg)';
  analogClock.classList.remove('urgent');
  exTimerPopup.classList.remove('show');
}

function updateClockVisual(remaining, total){
  restDigital.textContent = formatMMSS(Math.max(remaining,0));
  const progress = Math.min(1, (total-remaining)/total);
  const deg = progress*360;
  restHand.style.transform = `translateX(-50%) rotate(${deg}deg)`;
  ringProgress.style.background = `conic-gradient(var(--neon) ${deg}deg, transparent ${deg}deg)`;
  analogClock.classList.toggle('urgent', remaining <= 5 && remaining > 0);
}

exTimerBtn.addEventListener('click', () => {
  if(exRestInterval){
    resetTimerVisual();
    return;
  }
  let seconds = parseInt(exRestSeconds.value, 10);
  if(!seconds || seconds <= 0) seconds = 60;
  const d = days[activeDay];
  d[exModalSide][exModalIndex].rest = exRestSeconds.value;
  saveDays();

  const total = seconds;
  let remaining = seconds;
  exTimerBtn.classList.add('running');
  exTimerPopup.classList.add('show');
  setTimerLabel('Stop');
  updateClockVisual(remaining, total);

  exRestInterval = setInterval(() => {
    remaining--;
    updateClockVisual(remaining, total);
    if(remaining <= 0){
      clearInterval(exRestInterval); exRestInterval = null;
      exTimerBtn.classList.remove('running');
      setTimerLabel('Start Rest');
      analogClock.classList.remove('urgent');
      playBeep();
      restDigital.textContent = 'Done';
      setTimeout(() => {
        restDigital.textContent = '00:00';
        ringProgress.style.background = 'conic-gradient(var(--neon) 0deg, transparent 0deg)';
        restHand.style.transform = 'translateX(-50%) rotate(0deg)';
        exTimerPopup.classList.remove('show');
      }, 1800);
    }
  }, 1000);
});

function openExerciseModal(side, index){
  const d = days[activeDay];
  const cw = d.currentWeek;
  const slot = d[side][index];
  const existing = d.weeks[cw-1].logs[side][index] || [];
  const planned = parseInt(slot.sets, 10) || 3;

  exModalSide = side; exModalIndex = index;
  exModal.classList.remove('all-done');
  resetTimerVisual();
  exRestSeconds.value = slot.rest || '';

  const rowCount = Math.max(existing.length, planned, 1);
  exModalRowsData = [];
  for(let i=0; i<rowCount; i++){
    exModalRowsData.push({ reps: existing[i] ? existing[i].reps : "", weight: existing[i] ? existing[i].weight : "", logged: !!existing[i] });
  }
  exModalCelebrated = false;

  exModalTitle.textContent = slot.exercise || 'Exercise';
  renderExRows();
  exModalOverlay.classList.add('show');
}

function renderExRows(){
  exSetRowsEl.innerHTML = "";
  exModalRowsData.forEach((row, i) => {
    const logged = !!row.logged;
    const rowEl = document.createElement('div');
    rowEl.className = 'ex-set-row' + (logged ? ' checked' : '');
    rowEl.innerHTML = `
      <button type="button" class="ex-check ${logged ? 'checked' : ''}" title="${logged ? 'Logged — tap to undo' : 'Tap to log this set'}">${logged ? '✓' : (i+1)}</button>
      <input type="number" min="0" class="ex-reps" placeholder="Reps" value="${row.reps}">
      <input type="number" min="0" step="0.5" class="ex-weight" placeholder="Weight (lb)" value="${row.weight}">
      <button type="button" class="ex-row-remove" title="Remove set">×</button>
    `;
    const repsInput = rowEl.querySelector('.ex-reps');
    const weightInput = rowEl.querySelector('.ex-weight');
    const checkBtn = rowEl.querySelector('.ex-check');

    repsInput.addEventListener('input', (e) => {
      exModalRowsData[i].reps = e.target.value;
      persistExRows();
    });
    weightInput.addEventListener('input', (e) => {
      exModalRowsData[i].weight = e.target.value;
      persistExRows();
    });
    checkBtn.addEventListener('click', () => {
      exModalRowsData[i].logged = !exModalRowsData[i].logged;
      persistExRows();
      renderExRows();
    });
    rowEl.querySelector('.ex-row-remove').addEventListener('click', () => {
      exModalRowsData.splice(i,1);
      persistExRows();
      renderExRows();
    });

    exSetRowsEl.appendChild(rowEl);
  });
}

function persistExRows(){
  const d = days[activeDay];
  const cw = d.currentWeek;
  const cleaned = exModalRowsData.filter(r => r.reps !== "" || r.weight !== "");
  d.weeks[cw-1].logs[exModalSide][exModalIndex] = cleaned;
  saveDays();
}

const exFinishBtn = document.getElementById('exFinishBtn');
exFinishBtn.addEventListener('click', () => {
  persistExRows();
  const anyLogged = exModalRowsData.some(r => r.reps !== "" && r.reps != null);
  if(anyLogged && !exModalCelebrated){
    exModalCelebrated = true;
    exModal.classList.add('all-done');
    spawnConfetti(exModal, { count: 26, mode: 'pop' });
    playBeep();
    showToast("🔥 Exercise logged!");
    setTimeout(() => { closeExerciseModal(); }, 900);
  } else {
    closeExerciseModal();
  }
});

exAddSetBtn.addEventListener('click', () => {
  exModalRowsData.push({ reps: "", weight: "" });
  persistExRows();
  renderExRows();
});

function closeExerciseModal(){
  if(exRestInterval){ clearInterval(exRestInterval); exRestInterval = null; }
  exModalOverlay.classList.remove('show');
  renderSlots();
}
exModalClose.addEventListener('click', closeExerciseModal);

  root.setProperty('--neon-strong', color.strong);
  root.setProperty('--upper', color.hex);
  root.setProperty('--lower', color.hex);
  root.setProperty('--neon-rgb', color.rgb);
  root.setProperty('--neon-strong-rgb', color.strongRgb);
  currentThemeHex = color.hex;
  modeDot.style.background = color.hex;
  modeDot.style.boxShadow = `0 0 8px ${color.hex}`;
  try{ localStorage.setItem(STORAGE_THEME, JSON.stringify(color)); }catch(e){}
  if(!opts.silent) showToast(`Vibe set: ${color.name}`);
}

function buildColorWheel(){
  colorWheelEl.innerHTML = '';
  const radius = 100, center = 130;
  THEME_COLORS.forEach((color) => {
    const idx = THEME_COLORS.indexOf(color);
    const angle = (Math.PI*2/THEME_COLORS.length)*idx - Math.PI/2;
    const x = center + radius*Math.cos(angle);
    const y = center + radius*Math.sin(angle);
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (color.hex.toLowerCase() === currentThemeHex.toLowerCase() ? ' active' : '');
    sw.style.left = x + 'px';
    sw.style.top = y + 'px';
    sw.style.background = color.hex;
    sw.style.color = color.hex;
    sw.title = color.name;
    sw.addEventListener('click', () => {
      applyTheme(color);
      colorWheelEl.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
      sw.classList.add('active');
      if(colorWheelCenterEl) colorWheelCenterEl.textContent = color.name;
    });
    colorWheelEl.appendChild(sw);
  });
  colorWheelCenterEl = document.createElement('div');
  colorWheelCenterEl.className = 'color-wheel-center';
  const active = THEME_COLORS.find(c => c.hex.toLowerCase() === currentThemeHex.toLowerCase()) || THEME_COLORS[0];
  colorWheelCenterEl.textContent = active.name;
  colorWheelEl.appendChild(colorWheelCenterEl);
}

function compareHtml(e){
  if(!e.prevLog || e.prevLog.length === 0) return `<span class="cmp-new">First time logged</span>`;
  const delta = e.volume - e.prevVolume;
  if(Math.abs(delta) < 0.01) return `<span class="cmp-flat">— same volume as last week</span>`;
  if(delta > 0) return `<span class="cmp-up">▲ +${Math.round(delta)} lb vs last week</span>`;
  return `<span class="cmp-down">▼ ${Math.round(delta)} lb vs last week</span>`;
}
function exSummaryItem(e, side){
  return `
    <div class="summary-ex-item">
      <div class="summary-ex-head">
        <span class="summary-ex-dot ${side}"></span>
        <span class="summary-ex-name">${escapeHtml(e.exercise)}</span>
        <span class="summary-ex-vol mono">${e.volume ? Math.round(e.volume)+' lb' : '—'}</span>
      </div>
      <div class="summary-ex-sets mono">${escapeHtml(formatLogSummary(e.log))}</div>
      <div class="summary-ex-compare">${compareHtml(e)}</div>
    </div>
  `;
}
function openSummaryModal(data){
  summarySub.textContent = `Week ${data.week} · ${data.title}${data.blockComplete ? ' · 4-week block complete!' : ''}`;
  summaryStats.innerHTML = `
    <div class="stat-card"><div class="stat-val mono">${Math.round(data.totalVolume)}</div><div class="stat-lbl">LB VOLUME</div></div>
    <div class="stat-card"><div class="stat-val mono">${data.calories}</div><div class="stat-lbl">EST. CALORIES</div></div>
    <div class="stat-card"><div class="stat-val mono">${formatHMS(data.duration)}</div><div class="stat-lbl">TOTAL TIME</div></div>
  `;
  summaryExercises.innerHTML =
    (data.upperSummary.length ? `<h4>UPPER BODY</h4>` + data.upperSummary.map(e => exSummaryItem(e,'upper')).join('') : '') +
    (data.lowerSummary.length ? `<h4>LOWER BODY</h4>` + data.lowerSummary.map(e => exSummaryItem(e,'lower')).join('') : '');
  confettiLayer.innerHTML = '';
  summaryModalOverlay.classList.add('show');

/* ---------------------------------------------------------
   FINISH WORKOUT / CLEAR DAY
--------------------------------------------------------- */
document.getElementById('finishBtn').addEventListener('click', async () => {
  if(exModalOverlay.classList.contains('show')) closeExerciseModal();

  const d = days[activeDay];
  const cw = d.currentWeek;
  const weekData = d.weeks[cw-1];

  function buildSummary(side){
    return d[side].map((slot,i) => {
      if(!slot.exercise) return null;
      const log = weekData.logs[side][i] || [];
      const prevLog = cw > 1 ? (d.weeks[cw-2].logs[side][i] || []) : [];
      return { exercise: slot.exercise, sets: slot.sets, log, prevLog, volume: calcVolume(log), prevVolume: calcVolume(prevLog) };
    }).filter(Boolean);
  }

  const upperSummary = buildSummary('upper');
  const lowerSummary = buildSummary('lower');

  if(upperSummary.length === 0 && lowerSummary.length === 0){
    showToast("Log at least one exercise before finishing.");
    return;
  }

  const totalSeconds = currentElapsed(d);
  const totalVolume = [...upperSummary, ...lowerSummary].reduce((s,e) => s + e.volume, 0);
  const calories = Math.max(0, Math.round((totalSeconds/60) * 6));

  const entry = {
    title: d.title || `Day ${activeDay+1} Workout`,
    type: d.type,
    date: weekData.date || new Date().toISOString().slice(0,10),
    week: cw,
    duration: totalSeconds,
    totalVolume,
    calories,
    upper: upperSummary.map(e => ({ exercise: e.exercise, sets: e.sets, log: e.log })),
    lower: lowerSummary.map(e => ({ exercise: e.exercise, sets: e.sets, log: e.log }))
  };
  const newId = await insertHistoryEntryToCloud(entry);
  history.unshift(Object.assign({}, entry, { id: newId || `local-${Date.now()}` }));

  d.timerStart = null;
  d.timerElapsed = 0;

  const blockComplete = cw === WEEK_COUNT;
  if(cw < WEEK_COUNT) d.currentWeek = cw + 1;
  flushSaveDays();
  renderAll();

  openSummaryModal({
    title: entry.title, week: cw, duration: totalSeconds, calories, totalVolume,
    upperSummary, lowerSummary, blockComplete
  });
});

/* ---------------------------------------------------------
   LOGBOOK VIEW
--------------------------------------------------------- */
const logList = document.getElementById('logList');
function renderLog(){
  if(history.length === 0){
    logList.innerHTML = `<div class="log-empty"><div class="display">No workouts logged yet</div>Finish a workout on the Build tab to start your history.</div>`;
    return;
  }
  logList.innerHTML = "";
  history.forEach(entry => {
    const dt = entry.date ? new Date(entry.date + 'T00:00:00') : null;
    const dayNum = dt ? dt.getDate() : '—';
    const monthStr = dt ? dt.toLocaleString('en-US', { month:'short' }).toUpperCase() : '';
    const totalEx = entry.upper.length + entry.lower.length;
    const durationTxt = entry.duration ? formatHMS(entry.duration) : null;
    const volTxt = entry.totalVolume ? Math.round(entry.totalVolume) + ' lb' : null;
    const calTxt = entry.calories ? entry.calories + ' kcal' : null;

    const card = document.createElement('div');
    card.className = 'log-entry';
    card.innerHTML = `
      <div class="log-entry-head">
        <div class="date-badge"><div class="d">${dayNum}</div><div class="m">${monthStr}</div></div>
        <div class="meta">
          <h3>${escapeHtml(entry.title)} ${entry.week ? `<span class="wk-pill">WEEK ${entry.week}</span>` : ''}</h3>
          <div class="tags">${entry.type ? escapeHtml(entry.type) + ' · ' : ''}${totalEx} exercise${totalEx===1?'':'s'}${durationTxt ? ' · ' + durationTxt : ''}${volTxt ? ' · ' + volTxt : ''}${calTxt ? ' · ' + calTxt : ''}</div>
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="log-entry-body">
        <div class="log-cols">
          <div>
            <h4>UPPER BODY</h4>
            ${entry.upper.length ? entry.upper.map(exRow).join('') : '<div style="color:var(--chalk-dim);font-size:13px;">None logged</div>'}
          </div>
          <div>
            <h4>LOWER BODY</h4>
            ${entry.lower.length ? entry.lower.map(exRow).join('') : '<div style="color:var(--chalk-dim);font-size:13px;">None logged</div>'}
          </div>
        </div>
        <div class="log-actions"><button class="btn-ghost delete-entry">Delete entry</button></div>
      </div>
    `;
    card.querySelector('.log-entry-head').addEventListener('click', () => card.classList.toggle('open'));
    card.querySelector('.delete-entry').addEventListener('click', async (e) => {
      e.stopPropagation();
      history = history.filter(h => h.id !== entry.id);
      renderLog();
      showToast("Entry deleted.");
      await deleteHistoryEntryFromCloud(entry.id);
    });
    logList.appendChild(card);
  });
}
function exRow(s){
  const summary = formatLogSummary(s.log);
  const vol = calcVolume(s.log);
  return `<div class="log-ex"><span class="name">${escapeHtml(s.exercise)}</span><span class="stat">${escapeHtml(summary)}${vol ? ' · ' + Math.round(vol) + 'lb' : ''}</span></div>`;
}

let authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  authTabLogin.classList.toggle('active', mode === 'login');
  authTabSignup.classList.toggle('active', mode === 'signup');
  authSubmitBtn.textContent = mode === 'login' ? 'Log In' : 'Create Account';
  authPassword.setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
  authError.textContent = '';
  authError.style.color = '';
}

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.style.color = '';
  authError.textContent = '';
  authSubmitBtn.disabled = true;
  authSubmitBtn.textContent = authMode === 'login' ? 'Logging in…' : 'Creating account…';
  const email = authEmail.value.trim();
  const password = authPassword.value;
  try{
    if(authMode === 'login'){
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
    } else {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if(error) throw error;
      if(data && data.user && !data.session){
        authError.style.color = 'var(--neon-strong)';
        authError.textContent = 'Check your email to confirm your account, then log in.';
        setAuthMode('login');
      }
    }
  }catch(err){
    authError.textContent = (err && err.message) || 'Something went wrong. Please try again.';
  }finally{
    authSubmitBtn.disabled = false;
    authSubmitBtn.textContent = authMode === 'login' ? 'Log In' : 'Create Account';
  }
});

authForgotBtn.addEventListener('click', async () => {
  const email = authEmail.value.trim();
  if(!email){ authError.textContent = 'Enter your email above first.'; return; }
  authError.style.color = '';
  try{
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
    if(error) throw error;
    authError.style.color = 'var(--neon-strong)';
    authError.textContent = 'Password reset email sent.';
  }catch(err){
    authError.textContent = (err && err.message) || 'Could not send reset email.';
  }
});

}
function showSplash(){
  currentUserId = null;

  appWrap.style.display = 'none';
  splashView.classList.remove('hide');
  authForm.reset();
  authError.textContent = '';
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if(event === 'TOKEN_REFRESHED') return;
  if(session && session.user){
    if(session.user.id !== currentUserId) showApp(session.user.id);
  } else {
    showSplash();
  }
});

supabaseClient.auth.getSession().then(({ data }) => {
  if(data && data.session && data.session.user){
    showApp(data.session.user.id);
  } else {
    showSplash();
  }
});
