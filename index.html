<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RepLog — PR Dial Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090a; --panel:#131417; --panel-2:#1a1c20; --line:#2a2d33;
    --chalk:#f1f3f1; --chalk-dim:#888d90; --chalk-faint:#55595c;
    --neon:#b6ff00; --neon-strong:#d9ff66; --neon-rgb:182,255,0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--chalk);
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:40px 16px;
    background-image:radial-gradient(circle at 50% -10%, rgba(var(--neon-rgb),0.07), transparent 45%);
  }
  .wrap{width:100%; max-width:380px;}
  h1{font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:.1em; text-transform:uppercase; color:var(--neon-strong); text-align:center; margin:0 0 4px; text-shadow:0 0 12px rgba(var(--neon-rgb),.35);}
  .sub{text-align:center; color:var(--chalk-dim); font-size:12px; margin-bottom:28px;}

  .dial-wrap{position:relative; width:260px; height:260px; margin:0 auto 24px; display:grid; place-items:center;}
  .dial-wrap::before{
    content:''; position:absolute; inset:-8%; border-radius:50%;
    background:conic-gradient(from -90deg, rgba(var(--neon-rgb),.35), transparent 20%, transparent 80%, rgba(var(--neon-rgb),.35));
    filter:blur(14px); animation:haloSpin 12s linear infinite; opacity:.7;
  }
  @keyframes haloSpin{ to{ transform:rotate(360deg); } }

  svg.dial{ position:relative; z-index:2; width:100%; height:100%; overflow:visible; transform:rotate(-90deg); }
  .track{ fill:none; stroke:rgba(255,255,255,.06); stroke-width:14; }
  .seg{ fill:none; stroke-width:14; stroke-linecap:round; cursor:pointer; transition:stroke-width .2s ease, filter .2s ease, opacity .2s ease; opacity:.38; }
  .seg.active{ opacity:1; filter:drop-shadow(0 0 8px rgba(var(--neon-rgb),.75)); stroke-width:16; }
  .seg:hover{ opacity:.85; }
  .hit{ fill:none; stroke:transparent; stroke-width:34; cursor:pointer; }

  .core{
    position:absolute; z-index:3; width:150px; height:150px; border-radius:50%;
    background:#0a0c0c; border:1px solid rgba(var(--neon-rgb),.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 0 40px rgba(var(--neon-rgb),.18), inset 0 0 30px rgba(var(--neon-rgb),.08);
  }
  .core::before{
    content:''; position:absolute; inset:-14px; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(var(--neon-rgb),.35), transparent 68%);
    filter:blur(10px); animation:corePulse 2.1s ease-in-out infinite;
  }
  @keyframes corePulse{ 0%,100%{ transform:scale(.85); opacity:.55; } 50%{ transform:scale(1.08); opacity:1; } }
  .core .lift-label{ font:800 11px 'Oswald',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--chalk-dim); margin-bottom:2px; }
  .core .lift-value{ font:800 40px/1 'JetBrains Mono',monospace; color:var(--neon-strong); text-shadow:0 0 14px rgba(var(--neon-rgb),.5); }
  .core .lift-unit{ font:700 10px 'Oswald',sans-serif; letter-spacing:.1em; color:var(--chalk-faint); margin-top:4px; text-transform:uppercase; }
  .core .lift-date{ font:500 9px 'Inter',sans-serif; color:var(--chalk-faint); margin-top:6px; }

  .spark{ position:absolute; z-index:4; width:6px; height:6px; border-radius:50%; background:var(--neon-strong); box-shadow:0 0 8px var(--neon-strong),0 0 16px rgba(var(--neon-rgb),.6); animation:orbit 4s linear infinite; }
  @keyframes orbit{ from{ transform:rotate(0deg) translateX(112px) rotate(0deg);} to{ transform:rotate(360deg) translateX(112px) rotate(-360deg);} }

  .chips{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chip{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
    cursor:pointer; transition:border-color .15s ease, background .15s ease;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .chip .name{ font:700 11px 'Oswald',sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--chalk); flex:1; }
  .chip .val{ font:700 12px 'JetBrains Mono',monospace; color:var(--chalk-dim); }
  .chip.active{ border-color:var(--neon); background:rgba(var(--neon-rgb),.08); }
  .chip.active .val{ color:var(--neon-strong); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Personal Records</h1>
  <div class="sub">Tap a segment or a lift to switch</div>

  <div class="dial-wrap" id="dialWrap">
    <svg class="dial" viewBox="0 0 260 260">
      <circle class="track" cx="130" cy="130" r="112"></circle>
      <g id="segGroup"></g>
      <g id="hitGroup"></g>
    </svg>
    <div class="core">
      <div class="lift-label" id="coreLabel">Squat</div>
      <div class="lift-value" id="coreValue">315</div>
      <div class="lift-unit">lb · all-time</div>
      <div class="lift-date" id="coreDate">Set Aug 14</div>
    </div>
    <div class="spark"></div>
  </div>

  <div class="chips" id="chips"></div>
</div>

<script>
const lifts = [
  { name:'Squat',    value:315, date:'Set Aug 14', color:'#b6ff00' },
  { name:'Bench',    value:225, date:'Set Jul 2',  color:'#7fe6ff' },
  { name:'Deadlift', value:405, date:'Set Sep 1',  color:'#ff9f5c' },
  { name:'OHP',      value:135, date:'Set Jun 20', color:'#d98bff' }
];

const r = 112, circ = 2 * Math.PI * r, gap = 10;
const segLen = (circ - gap * lifts.length) / lifts.length;
const segGroup = document.getElementById('segGroup');
const hitGroup = document.getElementById('hitGroup');
const chips = document.getElementById('chips');
let active = 0;

lifts.forEach((lift, i) => {
  const offset = -(i * (segLen + gap));
  const seg = document.createElementNS('http://www.w3.org/2000/svg','circle');
  seg.setAttribute('class','seg'); seg.setAttribute('cx',130); seg.setAttribute('cy',130); seg.setAttribute('r',r);
  seg.setAttribute('stroke', lift.color);
  seg.setAttribute('stroke-dasharray', `${segLen} ${circ - segLen}`);
  seg.setAttribute('stroke-dashoffset', offset);
  seg.dataset.index = i;
  segGroup.appendChild(seg);

  const hit = document.createElementNS('http://www.w3.org/2000/svg','circle');
  hit.setAttribute('class','hit'); hit.setAttribute('cx',130); hit.setAttribute('cy',130); hit.setAttribute('r',r);
  hit.setAttribute('stroke-dasharray', `${segLen} ${circ - segLen}`);
  hit.setAttribute('stroke-dashoffset', offset);
  hit.addEventListener('click', () => setActive(i));
  hitGroup.appendChild(hit);

  const chip = document.createElement('div');
  chip.className = 'chip'; chip.dataset.index = i;
  chip.innerHTML = `<span class="dot" style="background:${lift.color}"></span><span class="name">${lift.name}</span><span class="val">${lift.value} lb</span>`;
  chip.addEventListener('click', () => setActive(i));
  chips.appendChild(chip);
});

function setActive(i){
  active = i;
  document.querySelectorAll('.seg').forEach(s => s.classList.toggle('active', +s.dataset.index === i));
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', +c.dataset.index === i));
  document.getElementById('coreLabel').textContent = lifts[i].name;
  document.getElementById('coreValue').textContent = lifts[i].value;
  document.getElementById('coreDate').textContent = lifts[i].date;
}
setActive(0);
</script>
</body>
</html>
